# Local infrastructure for Khabar AI: MongoDB (system of record) and Qdrant
# (semantic search). The Node API, React app, and Python model helpers run
# natively; see README.md.
#
#   docker compose up -d      # start
#   docker compose down       # stop (data is kept in named volumes)

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  qdrant:
    image: qdrant/qdrant:v1.16.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  mongo-data:
  qdrant-data:
